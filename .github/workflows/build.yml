name: AssetStudioBuild

on:
  push:
    branches: [ AssetStudioMod ]
  pull_request:
    branches: [ AssetStudioMod ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Cache FBX SDK
        id: cache-fbx
        uses: actions/cache@v4
        with:
          path: C:\Program Files\Autodesk\FBX\FBX SDK\2020.2.1
          key: fbxsdk-2020.2.1-vs2019

      - name: Download FBX SDK
        if: steps.cache-fbx.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force fbx | Out-Null
          Invoke-WebRequest "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_win.exe" -OutFile "fbx\fbxsdk.exe"
          Start-Process -FilePath "fbx\fbxsdk.exe" -ArgumentList "/S" -Wait

      - name: Build native libraries
        shell: pwsh
        run: |
          foreach ($platform in 'Win32', 'x64') {
            msbuild Texture2DDecoderNative\Texture2DDecoderNative.vcxproj /p:Configuration=Release /p:Platform=$platform /verbosity:minimal
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            msbuild AssetStudioFBXNative\AssetStudioFBXNative.vcxproj /p:Configuration=Release /p:Platform=$platform /verbosity:minimal
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Publish GUI
        run: dotnet publish AssetStudioGUI\AssetStudioGUI.csproj -c Release -f net10.0-windows --self-contained false -o publish\GUI

      - name: Publish CLI
        run: dotnet publish AssetStudioCLI\AssetStudioCLI.csproj -c Release -f net10.0 --self-contained false -o publish\CLI

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudioModGUI.net10
          path: publish/GUI

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudioModCLI.net10
          path: publish/CLI
